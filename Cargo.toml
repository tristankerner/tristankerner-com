[package]
name = "tristankerner-com"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
actix-files = "0.6.10"
actix-web = { version = "4.14.0", features = ["rustls-0_23"] }
actix-ws = "0.4.0"
futures-util = "0.3.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
# Already compiled as part of actix-files; used directly so precompressed
# variants keep the content type of the file they stand in for.
mime_guess = "2"
tokio = { version = "1.53.0", features = ["macros", "sync"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
dotenvy = "0.15.7"
# GA4 Data API client (src/ga4.rs) for the visitor ticker, and the
# service-account auth (JSON key -> bearer token) it queries with.
google-analytics-api-ga4 = "0.2.0"
gcp_auth = "0.12.7"
rusqlite = { version = "0.40.1", features = ["bundled"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# HMAC-SHA256 for visitor keys (src/visitor_key.rs) and secure random
# secret generation (src/store.rs) - both MIT OR Apache-2.0, matching this
# crate's own MIT license. Deliberately not `ring` (which rustls/gcp_auth
# already pull in transitively for their own needs, under Apache-2.0 AND
# ISC): kept out of our own direct dependencies so this crate's own code
# only ever chooses to depend on MIT-available crates.
hmac = "0.13.0"
sha2 = "0.11.0"
getrandom = "0.2"

# Slower compile, but a smaller and faster binary for the resource-limited VPS.
[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
actix-test = "0.1.5"
awc = "3.8.2"
rcgen = "0.14.8"
serial_test = "3.5.0"
tempfile = "3.27.0"
