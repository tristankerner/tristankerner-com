# Builds the frontend and server directly on the runner (with dependency
# caching), runs both test suites with a 90%+ coverage gate, then packages
# the already-built artifacts into the runtime image (see Dockerfile - it no
# longer compiles anything itself) and ships it straight to the production
# VM - no container registry involved. The image is `docker save`'d to a
# tarball, copied to the VM over an IAP-tunneled SSH connection (so the VM
# never needs port 22 open to the public internet), and loaded with
# `docker load`. deploy/run.sh then stops/replaces the previously running
# app container in place, leaving any certbot-issued certificate under
# $STATE_DIR untouched.
#
# --- One-time setup on the GCP side (not done by this workflow) ----------
# 1. Enable OS Login on the project or instance (metadata `enable-oslogin =
#    TRUE`).
# 2. Add a firewall rule allowing tcp:22 from 35.235.240.0/20 (the IAP
#    forwarding range) to the VM - this is IAP's tunnel, not a public-facing
#    SSH port.
# 3. Create a dedicated service account and grant it, on the project (or
#    just the instance):
#      - roles/iap.tunnelResourceAccessor  (open the IAP tunnel used for
#        SSH/SCP below)
#      - roles/compute.osAdminLogin        (SSH in via OS Login *with*
#        sudo - needed to run `docker` as root on Container-Optimized OS)
#      - roles/compute.viewer              (resolve the instance's zone/IP
#        by name)
#    Then create a JSON key for it and store it as the GCP_SA_KEY secret
#    below.
# 4. The GCP firewall must also allow ingress on whatever ports HTTP_PORT/
#    HTTPS_PORT below resolve to (80/443 by default) from the public
#    internet - that's the actual web traffic, separate from the IAP/SSH
#    rule above.
name: Build, test, and deploy

on:
  push:
    branches: [production]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # setup-bun has no built-in dependency cache (unlike actions/setup-node),
      # so this caches bun's own global package cache directly, keyed on the
      # lockfile.
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      # Both IDs are public client-side identifiers (they ship in the built
      # JS regardless), so they're plain repository variables rather than
      # secrets. Vite only inlines VITE_-prefixed vars that are present at
      # build time; unset ones fall back to the placeholders in
      # frontend/src/lib/consent/config.ts.
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_GOOGLE_ANALYTICS_ID: ${{ vars.GOOGLE_ANALYTICS_ID }}
          VITE_FACEBOOK_PIXEL_ID: ${{ vars.FACEBOOK_PIXEL_ID }}
        run: bun run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      # Caches ~/.cargo and target/ keyed on Cargo.lock, so an unrelated
      # frontend-only change doesn't force a full recompile of every crate.
      # Also speeds up the coverage-instrumented test compile below, since
      # both share the same crates.io registry/download cache.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build server
        run: cargo build --release

      # Thresholds live in frontend/vite.config.ts (`test.coverage.thresholds`)
      # and the --fail-under-* flags below, so these steps fail on their own
      # (blocking the image build/deploy steps further down) if either suite
      # drops under 90%.
      - name: Frontend tests with coverage
        working-directory: frontend
        run: bun run coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # lines/regions/functions only - branch coverage in cargo-llvm-cov
      # needs nightly Rust, which this project doesn't otherwise use.
      - name: Server tests with coverage
        run: |
          cargo llvm-cov \
            --fail-under-lines 90 \
            --fail-under-regions 90 \
            --fail-under-functions 90

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The Dockerfile just copies the frontend/target artifacts built above
      # into a distroless runtime image - no compilation happens in Docker,
      # so there's no expensive layer to cache here anymore.
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ vars.IMAGE_NAME || 'tristankerner-com' }}:latest
          load: true

      - name: Save image to a tarball (no registry involved)
        env:
          IMAGE_NAME: ${{ vars.IMAGE_NAME || 'tristankerner-com' }}
        run: docker save "$IMAGE_NAME:latest" | gzip > image.tar.gz

      # GCP_SA_KEY: JSON key for the service account described above
      # (iap.tunnelResourceAccessor + compute.osAdminLogin + compute.viewer).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Written as real env vars (not interpolated into the script text) so
      # secret values can't be reinterpreted as shell syntax. Never echoed.
      - name: Write deploy config for the VM
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          LETSENCRYPT_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}
          # CLOUDFLARE_API_TOKEN: Cloudflare API Token (not the legacy Global
          # API Key) scoped to "Zone:DNS:Edit" for this zone only (My
          # Profile -> API Tokens -> Create Token -> "Edit zone DNS"
          # template, restricted to DOMAIN's zone). Used by certbot's
          # dns-cloudflare plugin for the DNS-01 challenge.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STATE_DIR: ${{ vars.STATE_DIR || '/var/lib/tristankerner' }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME || 'tristankerner-com' }}
          CONTAINER_NAME: ${{ vars.CONTAINER_NAME || 'tristankerner-com' }}
          HTTP_PORT: ${{ vars.HTTP_PORT || '80' }}
          HTTPS_PORT: ${{ vars.HTTPS_PORT || '443' }}
          CONTAINER_PORT: ${{ vars.CONTAINER_PORT || '80' }}
          CONTAINER_TLS_PORT: ${{ vars.CONTAINER_TLS_PORT || '443' }}
          # GA4_PROPERTY_ID: numeric GA4 property ID the visitor ticker
          # queries (see src/ga4.rs). Not sensitive on its own (same
          # category as GOOGLE_ANALYTICS_ID above), hence a plain variable.
          # Leaving it unset keeps GA4 querying disabled even in production.
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          # GA4_TOP_PAGES_LIMIT: how many of the most-visited pages the GA4
          # report returns (src/ga4.rs defaults to 50 if this is left unset).
          GA4_TOP_PAGES_LIMIT: ${{ vars.GA4_TOP_PAGES_LIMIT }}
          # VISITOR_TICK_INTERVAL_MINUTES: how often the ticker wakes up to
          # check for active connections and refresh counts (src/ws_counter.rs
          # defaults to 1 if this is left unset).
          VISITOR_TICK_INTERVAL_MINUTES: ${{ vars.VISITOR_TICK_INTERVAL_MINUTES }}
        run: |
          umask 077
          {
            printf 'DOMAIN=%s\n' "$DOMAIN"
            printf 'LETSENCRYPT_EMAIL=%s\n' "$LETSENCRYPT_EMAIL"
            printf 'CLOUDFLARE_API_TOKEN=%s\n' "$CLOUDFLARE_API_TOKEN"
            printf 'STATE_DIR=%s\n' "$STATE_DIR"
            printf 'IMAGE_NAME=%s\n' "$IMAGE_NAME"
            printf 'CONTAINER_NAME=%s\n' "$CONTAINER_NAME"
            printf 'HTTP_PORT=%s\n' "$HTTP_PORT"
            printf 'HTTPS_PORT=%s\n' "$HTTPS_PORT"
            printf 'CONTAINER_PORT=%s\n' "$CONTAINER_PORT"
            printf 'CONTAINER_TLS_PORT=%s\n' "$CONTAINER_TLS_PORT"
            printf 'GA4_PROPERTY_ID=%s\n' "$GA4_PROPERTY_ID"
            printf 'GA4_TOP_PAGES_LIMIT=%s\n' "$GA4_TOP_PAGES_LIMIT"
            printf 'VISITOR_TICK_INTERVAL_MINUTES=%s\n' "$VISITOR_TICK_INTERVAL_MINUTES"
          } > deploy.env

      # GA4_CREDENTIALS_JSON: full JSON contents of a GCP service-account
      # key (Admin -> Property Access Management on the GA4 property must
      # grant this service account "Viewer"). Written to its own file
      # rather than folded into deploy.env above since it's multi-line;
      # written unconditionally (possibly empty, if the secret isn't set)
      # so the scp step below always has a fixed file list. Staged
      # alongside deploy.env and deleted from the VM on exit by
      # deploy/remote-entrypoint.sh the same way.
      - name: Write GA4 service-account key for the VM
        env:
          GA4_CREDENTIALS_JSON: ${{ secrets.GA4_CREDENTIALS_JSON }}
        run: |
          umask 077
          printf '%s' "$GA4_CREDENTIALS_JSON" > ga4-credentials.json

      # GCP_PROJECT_ID / GCP_ZONE / GCP_INSTANCE_NAME: identify the target
      # VM. GCP_ZONE/GCP_INSTANCE_NAME also used by the two steps below.
      - name: Stage deploy files on the VM
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          GCP_INSTANCE_NAME: ${{ vars.GCP_INSTANCE_NAME }}
        run: |
          gcloud compute ssh "$GCP_INSTANCE_NAME" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --command "mkdir -p /tmp/tristankerner-deploy"

          gcloud compute scp \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            image.tar.gz deploy/run.sh deploy/remote-entrypoint.sh deploy.env ga4-credentials.json \
            "$GCP_INSTANCE_NAME:/tmp/tristankerner-deploy/"

      - name: Run deploy on the VM
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          GCP_INSTANCE_NAME: ${{ vars.GCP_INSTANCE_NAME }}
        run: |
          gcloud compute ssh "$GCP_INSTANCE_NAME" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --command "sudo bash /tmp/tristankerner-deploy/remote-entrypoint.sh"

      - name: Remove local deploy config from the runner
        if: always()
        run: rm -f deploy.env ga4-credentials.json image.tar.gz
