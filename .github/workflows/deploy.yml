# Builds the frontend and server directly on the runner (with dependency
# caching), runs both test suites with a 90%+ coverage gate, then packages
# the already-built artifacts into the runtime image (see Dockerfile - it no
# longer compiles anything itself), pushes that image to Artifact Registry,
# and has the production VM pull it.
#
# The image used to be `docker save`'d to a ~14MB tarball and pushed to the
# VM through the IAP tunnel by `gcloud compute scp`. That transfer was the
# entire deploy-time problem: identical payload, but it completed in ~10s on
# a good day and stalled for 7 or 14 minutes on a bad one (the gcloud IAP
# relay stalling and reconnecting), which is what made deploys swing between
# 4 and 20 minutes. Artifact Registry takes the image off the tunnel
# entirely - the VM pulls over Google's own network - so deploys are now
# both fast and predictable. It also means only changed layers ship, so a
# frontend-only change moves ~2MB rather than the whole 14MB.
#
# The tunnel is still used, just for what it's good at: the SSH command
# itself and the few KB of control-plane files (deploy.env carries the
# Cloudflare token, so it goes over scp rather than through `--command`,
# where it would show up in the VM's process list). The VM still never
# needs port 22 open to the public internet. deploy/run.sh then
# stops/replaces the previously running app container in place, leaving any
# certbot-issued certificate under $STATE_DIR untouched.
#
# --- One-time setup on the GCP side (not done by this workflow) ----------
# 1. Enable OS Login on the project or instance (metadata `enable-oslogin =
#    TRUE`).
# 2. Add a firewall rule allowing tcp:22 from 35.235.240.0/20 (the IAP
#    forwarding range) to the VM - this is IAP's tunnel, not a public-facing
#    SSH port.
# 3. Create a dedicated service account and grant it, on the project (or
#    just the instance):
#      - roles/iap.tunnelResourceAccessor  (open the IAP tunnel used for
#        SSH/SCP below)
#      - roles/compute.osAdminLogin        (SSH in via OS Login *with*
#        sudo - needed to run `docker` as root on Container-Optimized OS)
#      - roles/compute.viewer              (resolve the instance's zone/IP
#        by name)
#      - roles/artifactregistry.writer     (push the image below; can be
#        granted on just the repository rather than the whole project)
#    Then create a JSON key for it and store it as the GCP_SA_KEY secret
#    below.
# 4. The GCP firewall must also allow ingress on whatever ports HTTP_PORT/
#    HTTPS_PORT below resolve to (80/443 by default) from the public
#    internet - that's the actual web traffic, separate from the IAP/SSH
#    rule above.
# 5. Enable artifactregistry.googleapis.com and create a Docker repository
#    in the same region as the VM (cross-region pulls are slower and incur
#    egress). Give it a cleanup policy - the free tier is 0.5GB and each
#    build adds roughly 11MB of new layers, so an unbounded repository
#    would eventually start costing money. See the README's "Registry setup
#    and retention" section for the exact commands, and
#    deploy/cleanup-policy.json for the policy itself.
# 6. Grant the *VM's* service account roles/artifactregistry.reader on that
#    repository so it can pull. The VM also needs the
#    devstorage.read_only scope, which is part of the default COS instance
#    scope set - `gcloud compute instances describe <vm> --format=
#    "value(serviceAccounts)"` to confirm.
name: Build, test, and deploy

on:
  push:
    branches: [production]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest
    # Pulls vars.*/secrets.* from the "production" GitHub Environment
    # (Settings -> Environments) rather than repo-level ones - environment
    # secrets/vars are only visible to a job that declares this. Pair with
    # that environment's own deployment-branch rule (restricted to
    # `production`) as a second guard alongside the on.push trigger above.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # setup-bun has no built-in dependency cache (unlike actions/setup-node),
      # so this caches bun's own global package cache directly, keyed on the
      # lockfile.
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      # Both IDs are public client-side identifiers (they ship in the built
      # JS regardless), so they're plain repository variables rather than
      # secrets. Vite only inlines VITE_-prefixed vars that are present at
      # build time; if GOOGLE_ANALYTICS_ID is left unset, that falls back to
      # a harmless placeholder, but an unset/blank FACEBOOK_PIXEL_ID disables
      # the Meta Pixel entirely rather than loading a fake one - see
      # frontend/src/lib/consent/config.ts.
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_GOOGLE_ANALYTICS_ID: ${{ vars.GOOGLE_ANALYTICS_ID }}
          VITE_FACEBOOK_PIXEL_ID: ${{ vars.FACEBOOK_PIXEL_ID }}
        run: bun run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      # Caches ~/.cargo and target/ keyed on Cargo.lock, so an unrelated
      # frontend-only change doesn't force a full recompile of every crate.
      # Also speeds up the coverage-instrumented test compile below, since
      # both share the same crates.io registry/download cache.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build server
        run: cargo build --release

      # Thresholds live in frontend/vite.config.ts (`test.coverage.thresholds`)
      # and the --fail-under-* flags below, so these steps fail on their own
      # (blocking the image build/deploy steps further down) if either suite
      # drops under 90%.
      - name: Frontend tests with coverage
        working-directory: frontend
        run: bun run coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # lines/regions/functions only - branch coverage in cargo-llvm-cov
      # needs nightly Rust, which this project doesn't otherwise use.
      - name: Server tests with coverage
        run: |
          cargo llvm-cov \
            --fail-under-lines 90 \
            --fail-under-regions 90 \
            --fail-under-functions 90

      # GCP_SA_KEY: JSON key for the service account described above
      # (iap.tunnelResourceAccessor + compute.osAdminLogin + compute.viewer
      # + artifactregistry.writer). Authentication has to happen before the
      # image build now, since that step pushes.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # AR_LOCATION should match the VM's region (GCP_ZONE minus its trailing
      # zone letter) - a cross-region pull is both slower and billed as
      # egress. Computed once here and reused by the build/push, deploy.env,
      # and rollback steps below rather than repeating the expression.
      - name: Resolve the image reference
        env:
          AR_LOCATION: ${{ vars.AR_LOCATION || 'us-west1' }}
          AR_REPOSITORY: ${{ vars.AR_REPOSITORY || 'tristankerner-com' }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME || 'tristankerner-com' }}
        run: |
          REGISTRY_HOST="${AR_LOCATION}-docker.pkg.dev"
          IMAGE_REPO="${REGISTRY_HOST}/${GCP_PROJECT_ID}/${AR_REPOSITORY}/${IMAGE_NAME}"
          {
            echo "REGISTRY_HOST=$REGISTRY_HOST"
            echo "IMAGE_REPO=$IMAGE_REPO"
            # The VM deploys this commit-SHA tag rather than :latest, so it
            # runs exactly what this run built even if another deploy
            # repoints :latest in between. :latest is still pushed below as
            # a convenience for humans inspecting the repository.
            echo "IMAGE_REF=${IMAGE_REPO}:${GITHUB_SHA}"
          } >> "$GITHUB_ENV"

      # Registers gcloud as a docker credential helper for this registry, so
      # the push below authenticates as the service account above.
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGISTRY_HOST" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The Dockerfile just copies the frontend/target artifacts built above
      # into a distroless runtime image - no compilation happens in Docker,
      # so there's no expensive layer to cache here anymore.
      #
      # provenance/sbom are off deliberately: they'd turn each push into a
      # multi-manifest index with extra attestation blobs, which both eats
      # into the 0.5GB free tier and makes the "keep N most recent versions"
      # cleanup policy harder to reason about. Nothing here consumes them.
      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: |
            ${{ env.IMAGE_REF }}
            ${{ env.IMAGE_REPO }}:latest
          push: true
          provenance: false
          sbom: false

      # Written as real env vars (not interpolated into the script text) so
      # secret values can't be reinterpreted as shell syntax. Never echoed.
      - name: Write deploy config for the VM
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          LETSENCRYPT_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}
          # CLOUDFLARE_API_TOKEN: Cloudflare API Token (not the legacy Global
          # API Key) scoped to "Zone:DNS:Edit" for this zone only (My
          # Profile -> API Tokens -> Create Token -> "Edit zone DNS"
          # template, restricted to DOMAIN's zone). Used by certbot's
          # dns-cloudflare plugin for the DNS-01 challenge.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STATE_DIR: ${{ vars.STATE_DIR || '/var/lib/tristankerner' }}
          CONTAINER_NAME: ${{ vars.CONTAINER_NAME || 'tristankerner-com' }}
          HTTP_PORT: ${{ vars.HTTP_PORT || '80' }}
          HTTPS_PORT: ${{ vars.HTTPS_PORT || '443' }}
          CONTAINER_PORT: ${{ vars.CONTAINER_PORT || '80' }}
          CONTAINER_TLS_PORT: ${{ vars.CONTAINER_TLS_PORT || '443' }}
          # GA4_PROPERTY_ID: numeric GA4 property ID the visitor ticker
          # queries (see src/ga4.rs). Not sensitive on its own (same
          # category as GOOGLE_ANALYTICS_ID above), hence a plain variable.
          # Leaving it unset keeps GA4 querying disabled even in production.
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          # GA4_TOP_PAGES_LIMIT: how many of the most-visited pages the GA4
          # report returns (src/ga4.rs defaults to 50 if this is left unset).
          GA4_TOP_PAGES_LIMIT: ${{ vars.GA4_TOP_PAGES_LIMIT }}
          # VISITOR_TICK_INTERVAL_MINUTES: how often the ticker wakes up to
          # check for active connections and refresh counts (src/ws_counter.rs
          # defaults to 1 if this is left unset).
          VISITOR_TICK_INTERVAL_MINUTES: ${{ vars.VISITOR_TICK_INTERVAL_MINUTES }}
          # TRUST_CF_CONNECTING_IP: only set to "true" once the GCP firewall
          # also restricts HTTP_PORT/HTTPS_PORT to Cloudflare's published IP
          # ranges - see the README's "Running behind Cloudflare" section.
          TRUST_CF_CONNECTING_IP: ${{ vars.TRUST_CF_CONNECTING_IP }}
        run: |
          umask 077
          {
            printf 'DOMAIN=%s\n' "$DOMAIN"
            printf 'LETSENCRYPT_EMAIL=%s\n' "$LETSENCRYPT_EMAIL"
            printf 'CLOUDFLARE_API_TOKEN=%s\n' "$CLOUDFLARE_API_TOKEN"
            printf 'STATE_DIR=%s\n' "$STATE_DIR"
            # REGISTRY_HOST/IMAGE_REF/IMAGE_REPO come from the "Resolve the
            # image reference" step above via $GITHUB_ENV.
            printf 'REGISTRY_HOST=%s\n' "$REGISTRY_HOST"
            printf 'IMAGE_REPO=%s\n' "$IMAGE_REPO"
            printf 'IMAGE_REF=%s\n' "$IMAGE_REF"
            printf 'CONTAINER_NAME=%s\n' "$CONTAINER_NAME"
            printf 'HTTP_PORT=%s\n' "$HTTP_PORT"
            printf 'HTTPS_PORT=%s\n' "$HTTPS_PORT"
            printf 'CONTAINER_PORT=%s\n' "$CONTAINER_PORT"
            printf 'CONTAINER_TLS_PORT=%s\n' "$CONTAINER_TLS_PORT"
            printf 'GA4_PROPERTY_ID=%s\n' "$GA4_PROPERTY_ID"
            printf 'GA4_TOP_PAGES_LIMIT=%s\n' "$GA4_TOP_PAGES_LIMIT"
            printf 'VISITOR_TICK_INTERVAL_MINUTES=%s\n' "$VISITOR_TICK_INTERVAL_MINUTES"
            printf 'TRUST_CF_CONNECTING_IP=%s\n' "$TRUST_CF_CONNECTING_IP"
          } > deploy.env

      # GA4_CREDENTIALS_JSON: full JSON contents of a GCP service-account
      # key (Admin -> Property Access Management on the GA4 property must
      # grant this service account "Viewer"). Written to its own file
      # rather than folded into deploy.env above since it's multi-line;
      # written unconditionally (possibly empty, if the secret isn't set)
      # so the scp step below always has a fixed file list. Staged
      # alongside deploy.env and deleted from the VM on exit by
      # deploy/remote-entrypoint.sh the same way.
      - name: Write GA4 service-account key for the VM
        env:
          GA4_CREDENTIALS_JSON: ${{ secrets.GA4_CREDENTIALS_JSON }}
        run: |
          umask 077
          printf '%s' "$GA4_CREDENTIALS_JSON" > ga4-credentials.json

      # NOTE: there used to be an "Install NumPy for gcloud IAP" step here -
      # the standard workaround for the IAP tunnel's slow pure-Python
      # websocket relay. It's gone because the only thing that made tunnel
      # throughput matter (the 14MB image tarball) no longer goes through
      # it; what's left is a few KB. If small transfers ever start stalling
      # too, that workaround is what to reach for again.
      #
      # GCP_PROJECT_ID / GCP_ZONE / GCP_INSTANCE_NAME: identify the target
      # VM. GCP_ZONE/GCP_INSTANCE_NAME also used by the two steps below.
      - name: Stage deploy files on the VM
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          GCP_INSTANCE_NAME: ${{ vars.GCP_INSTANCE_NAME }}
        run: |
          gcloud compute ssh "$GCP_INSTANCE_NAME" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command "mkdir -p /tmp/tristankerner-deploy"

          gcloud compute scp \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --quiet \
            deploy/run.sh deploy/remote-entrypoint.sh deploy.env ga4-credentials.json \
            "$GCP_INSTANCE_NAME:/tmp/tristankerner-deploy/"

      - name: Run deploy on the VM
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          GCP_INSTANCE_NAME: ${{ vars.GCP_INSTANCE_NAME }}
        run: |
          gcloud compute ssh "$GCP_INSTANCE_NAME" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --command "sudo bash /tmp/tristankerner-deploy/remote-entrypoint.sh"

      - name: Remove local deploy config from the runner
        if: always()
        run: rm -f deploy.env ga4-credentials.json
