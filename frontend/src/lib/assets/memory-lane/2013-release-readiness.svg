<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A calendar page beside a webinar screen playing a cloud logo, with a perfect unbroken row of checkmarks for never missing a Release Readiness webinar">
  <rect width="400" height="300" fill="#2c4454" />
  <!-- calendar -->
  <g transform="translate(50,80)">
    <rect x="0" y="10" width="120" height="110" rx="6" fill="#e8f0ee" />
    <rect x="0" y="10" width="120" height="26" rx="6" fill="#d9704f" />
    <rect x="16" y="0" width="8" height="20" rx="2" fill="#567585" />
    <rect x="96" y="0" width="8" height="20" rx="2" fill="#567585" />
    <g fill="#8aa2ab">
      <circle cx="20" cy="55" r="4" /><circle cx="40" cy="55" r="4" /><circle cx="60" cy="55" r="4" /><circle cx="80" cy="55" r="4" /><circle cx="100" cy="55" r="4" />
      <circle cx="20" cy="75" r="4" /><circle cx="40" cy="75" r="4" /><circle cx="60" cy="75" r="4" /><circle cx="80" cy="75" r="4" /><circle cx="100" cy="75" r="4" />
    </g>
    <circle cx="80" cy="95" r="10" fill="#5ad66d" />
    <path d="M76 95 l3 4 6 -7" stroke="#e8f0ee" stroke-width="2" fill="none" />
  </g>
  <!-- webinar screen -->
  <g transform="translate(220,90)">
    <rect x="0" y="0" width="130" height="90" rx="6" fill="#0d1a20" stroke="#3f5c6c" stroke-width="4" />
    <ellipse cx="65" cy="45" rx="26" ry="16" fill="#6fb3d9" />
    <circle cx="45" cy="38" r="12" fill="#6fb3d9" />
    <circle cx="85" cy="35" r="10" fill="#6fb3d9" />
    <rect x="50" y="94" width="30" height="8" fill="#567585" />
  </g>
  <!-- streak of checkmarks -->
  <g stroke="#5ad66d" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M60 230 l6 6 10 -12" /><path d="M100 230 l6 6 10 -12" /><path d="M140 230 l6 6 10 -12" />
    <path d="M180 230 l6 6 10 -12" /><path d="M220 230 l6 6 10 -12" />
  </g>
</svg>
