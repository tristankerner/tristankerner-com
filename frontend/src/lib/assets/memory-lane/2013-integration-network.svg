<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A web of connected plug nodes labeled REST and SOAP spinning around a clock face, with small colored dots for Vue, Foundation, and Bootstrap">
  <rect width="400" height="300" fill="#223642" />
  <!-- clock -->
  <circle cx="200" cy="150" r="70" fill="none" stroke="#3f5c6c" stroke-width="6" />
  <line x1="200" y1="150" x2="200" y2="105" stroke="#e8a33d" stroke-width="5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 200 150" to="360 200 150" dur="6s" repeatCount="indefinite" />
  </line>
  <line x1="200" y1="150" x2="230" y2="150" stroke="#6fb3d9" stroke-width="5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 200 150" to="360 200 150" dur="2s" repeatCount="indefinite" />
  </line>
  <!-- REST/SOAP nodes -->
  <g font-family="monospace" font-size="12" fill="#16232c">
    <circle cx="70" cy="80" r="24" fill="#5ad66d" /><text x="70" y="84" text-anchor="middle">REST</text>
    <circle cx="330" cy="220" r="24" fill="#c76b9c" /><text x="330" y="224" text-anchor="middle">SOAP</text>
  </g>
  <path d="M92 92 L150 130 M310 208 L252 172" stroke="#8aa2ab" stroke-width="2" stroke-dasharray="5 5" fill="none" />
  <!-- framework dots -->
  <circle cx="60" cy="230" r="8" fill="#5ad66d" />
  <circle cx="330" cy="70" r="8" fill="#6fb3d9" />
  <circle cx="200" cy="260" r="8" fill="#c76b9c" />
</svg>
