<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A pixelated stick figure mid dance move, surrounded by looping sparkle stars, in the style of a classic looping animated GIF">
  <rect width="400" height="300" fill="#1c2e38" />
  <path d="M0 250 L400 250 L400 300 L0 300 Z" fill="#16232c" />
  <!-- dancing pixel figure -->
  <g transform="translate(160,90)">
    <rect x="30" y="0" width="20" height="20" fill="#e8a33d" />
    <rect x="20" y="20" width="40" height="50" fill="#6fb3d9" />
    <rect x="0" y="30" width="20" height="15" fill="#6fb3d9" />
    <rect x="60" y="10" width="20" height="15" fill="#6fb3d9" />
    <rect x="10" y="70" width="15" height="40" fill="#d9704f" />
    <rect x="45" y="70" width="15" height="40" fill="#d9704f" transform="rotate(20 52 90)" />
    <animateTransform attributeName="transform" type="translate" values="160,90; 160,80; 160,90" dur="0.8s" repeatCount="indefinite" additive="sum" />
  </g>
  <!-- sparkles -->
  <g fill="#5ad66d">
    <path d="M280 60 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 z">
      <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite" />
    </path>
    <path d="M90 150 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" fill="#c76b9c">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.3s" repeatCount="indefinite" />
    </path>
    <path d="M310 170 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 z" fill="#e8a33d">
      <animate attributeName="opacity" values="1;0.3;1" dur="0.9s" repeatCount="indefinite" />
    </path>
  </g>
  <!-- loop arrow -->
  <path d="M60 220 a30 30 0 1 1 8 20" stroke="#5ad66d" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M60 220 l-10 -6 2 14 z" fill="#5ad66d" />
</svg>
