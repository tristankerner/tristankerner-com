<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A towering nine hundred page Perl book squashing a small ThinkPad laptop, which sprouts a sweat drop">
  <rect width="400" height="300" fill="#28404d" />
  <path d="M0 250 L400 250 L400 300 L0 300 Z" fill="#1c2e38" />
  <!-- stacked book -->
  <g>
    <rect x="110" y="60" width="180" height="26" rx="3" fill="#d9704f" />
    <rect x="105" y="86" width="190" height="26" rx="3" fill="#c76b9c" />
    <rect x="112" y="112" width="176" height="26" rx="3" fill="#e8a33d" />
    <text x="200" y="103" text-anchor="middle" font-family="monospace" font-size="16" fill="#0d1a20">PERL — 900pp</text>
  </g>
  <!-- squashed laptop -->
  <g transform="translate(140,150)">
    <rect x="0" y="30" width="120" height="14" rx="3" fill="#567585" />
    <rect x="10" y="0" width="100" height="30" rx="3" fill="#3f5c6c" />
    <rect x="18" y="6" width="84" height="18" fill="#0d1a20" />
    <rect x="50" y="9" width="20" height="12" fill="#6fb3d9" opacity="0.5" />
  </g>
  <!-- sweat drop -->
  <path d="M270 150 q8 14 0 20 q-8 -6 0 -20 z" fill="#6fb3d9">
    <animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite" />
  </path>
</svg>
