<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Three interlocking gears of different colors turning smoothly together, with a small thumbs up, representing a great team overhauling a system">
  <rect width="400" height="300" fill="#28404d" />
  <g transform="translate(160,150)" fill="#6fb3d9">
    <circle r="45" />
    <g>
      <rect x="-6" y="-58" width="12" height="18" /><rect x="-6" y="40" width="12" height="18" />
      <rect x="-58" y="-6" width="18" height="12" /><rect x="40" y="-6" width="18" height="12" />
      <rect x="-46" y="-46" width="12" height="16" transform="rotate(45 -40 -38)" /><rect x="34" y="-46" width="12" height="16" transform="rotate(-45 40 -38)" />
      <rect x="-46" y="30" width="12" height="16" transform="rotate(-45 -40 38)" /><rect x="34" y="30" width="12" height="16" transform="rotate(45 40 38)" />
    </g>
    <circle r="18" fill="#28404d" />
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite" additive="sum" />
  </g>
  <g transform="translate(255,145)" fill="#5ad66d">
    <circle r="30" />
    <g>
      <rect x="-5" y="-40" width="10" height="14" /><rect x="-5" y="26" width="10" height="14" />
      <rect x="-40" y="-5" width="14" height="10" /><rect x="26" y="-5" width="14" height="10" />
    </g>
    <circle r="12" fill="#28404d" />
    <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite" additive="sum" />
  </g>
  <g transform="translate(300,195)" fill="#e8a33d">
    <circle r="20" />
    <circle r="8" fill="#28404d" />
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite" additive="sum" />
  </g>
  <g transform="translate(90,215)">
    <path d="M0 20 v-10 a6 6 0 0 1 6 -6 h4 l4 -16 a5 5 0 0 1 10 2 l-2 14 h14 a6 6 0 0 1 6 8 l-4 14 a8 8 0 0 1 -8 6 h-24 a6 6 0 0 1 -6 -6 z" fill="#e8f0ee" />
  </g>
</svg>
