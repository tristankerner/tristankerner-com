<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A Salesforce style cloud wearing a graduation cap, with an admin badge pinned beside it, for learning both administration and development">
  <rect width="400" height="300" fill="#28404d" />
  <g transform="translate(110,140)">
    <ellipse cx="60" cy="60" rx="75" ry="45" fill="#6fb3d9" />
    <circle cx="30" cy="45" r="36" fill="#6fb3d9" />
    <circle cx="100" cy="42" r="32" fill="#6fb3d9" />
  </g>
  <!-- grad cap -->
  <g transform="translate(120,90)">
    <path d="M50 0 L100 20 L50 40 L0 20 Z" fill="#16232c" />
    <rect x="45" y="20" width="10" height="20" fill="#3f5c6c" />
    <line x1="90" y1="22" x2="90" y2="45" stroke="#e8a33d" stroke-width="2" />
    <circle cx="90" cy="47" r="4" fill="#e8a33d" />
  </g>
  <!-- admin badge -->
  <g transform="translate(300,180)">
    <circle r="26" fill="#e8a33d" />
    <path d="M-10 0 l7 8 14 -16" stroke="#16232c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
