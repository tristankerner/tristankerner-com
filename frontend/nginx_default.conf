server {
    listen 80;
    server_name localhost;

    root /var/www/tristankerner.com/frontend/build; # Path to your SvelteKit build directory
    index index.html;

    # Serve precompressed gzip assets generated during build
    gzip_static on;

    location / {
        # 1. Try to serve the exact file (e.g., /about -> /about.html or /about/)
        # 2. Fall back to 404.html so SvelteKit's client routing can handle it
        try_files $uri $uri/ $uri.html /404.html;
	}

    # Cache immutable SvelteKit build chunks permanently to maximize performance
    location /_app/ {
        expires max;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Ensure HTML pages are never cached so users always get the latest version
    location ~* \.(?:html)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }
}
